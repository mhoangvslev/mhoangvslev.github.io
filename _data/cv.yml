      - company: Inria, Wimmics team
        position: Postdoctoral Researcher
        start_date: 2026-06
        end_date: 2029-06
        summary: Natural Language Based Secure Federated Query Building
        highlights:
          - The grounding of LLM in the Knowledge Graph (GraphRAG) helps reduce hallucination in the generated answer.
          - Develop a federated query builder and end-user interface, coupling generative models with linked data for natural language interaction.
      - company: JusMundi
        position: Applied Research and Development Engineer
        start_date: 2024-11
        end_date: 2026-05
        highlights:
          - Replaced a hard-coded-rules RAG system with a knowledge-graph-based retrieval system using a domain ontology and RDB-to-RDF mappings, achieving comparable performance through graph-based retrieval and embeddings.
          - Synthetically generated queries from a large corpus of legal documents and used the query-document pairs to fine-tune a long-context embedding model, achieving a 30%pt recall improvement for the Agentic RAG system.
      - company: Nantes University (LS2N)
        position: Doctoral Researcher
        start_date: 2021-09
        end_date: 2024-11
        summary: Query the Web as a Knowledge Graph
        highlights:
          - Proposed an evaluation pipeline that uses Schema.org ontology and documentation to verify LLMs' output when extracting Knowledge Graphs from Web pages.
          - Created FedShop, a benchmark testing the scalability of SPARQL federation engines in the number of sources, and a new federation engine that finds better source assignments than existing engines.
      - company: Visage.jobs
        position: Intern, e-mail personalisation through data
        start_date: 2021-02
        end_date: 2021-07
        highlights:
          - Used text similarity metrics (Jaccard, Cosine) to show most users use templates without personalization.
          - Tagged email sentences with text classification to extract user writing patterns.
          - Used Association Rule mining to explain the factors that drive candidate engagement.
